version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: sales_postgres
    restart: always
    environment:
      POSTGRES_DB: salesdb
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales2024
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sales_backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://sales:sales2024@postgres:5432/salesdb
      SECRET_KEY: sales-secret-key-change-in-production
    depends_on:
      - postgres

networks:
  default:
    name: sales-net
